services:
  save-relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?Set RELAY_SECRET in relay-server/.env}
      RELAY_MAX_STORAGE_BYTES: ${RELAY_MAX_STORAGE_BYTES:-1073741824}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - relay-data:/data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
